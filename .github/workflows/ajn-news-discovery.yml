name: AJN Comprehensive Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit CI contract
        run: node scripts/audit-ci-contract.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: TypeScript / strict type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint
        run: npm run lint

      - name: News discovery unit and invariant tests
        run: npm run test:news-discovery

      - name: Archive behavioral integration tests
        run: npx tsx server/archiveNewsDiscovery.test.ts
      - name: Archive media resolver tests
        run: npm run test:archive-resolver

      - name: Split-show directory contract
        run: npm run test:archive-split-directory

      - name: Split-show provenance parser tests
        run: npm run test:archive-split-show

      - name: Real Archive split-show provenance audit
        run: npm run audit:archive-split-shows | tee archive-split-show-audit.json

      - name: Upload split-show audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajn-archive-split-show-audit
          path: archive-split-show-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Production build
        run: npm run build

      - name: Verify required build output
        run: |
          test -f dist/index.html
          test -f dist/server.cjs

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajn-build-evidence
          path: |
            dist/**
            package.json
            tsconfig.json
          if-no-files-found: warn
          retention-days: 14
